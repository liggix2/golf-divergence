<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golf Odds Divergence Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Golf Odds Divergence Tracker</h1>
        <p class="subtitle">Compare fair odds against prediction markets</p>
    </header>

    <main>
        <section class="controls">
            <label for="tournament-select">Tournament:</label>
            <select id="tournament-select">
                <option value="">Select a tournament...</option>
                <option value="2024-week-1">Sample Tournament 2024</option>
            </select>
        </section>

        <section class="odds-table-container">
            <table id="odds-table">
                <thead>
                    <tr>
                        <th>Player</th>
                        <th>My Fair Odds</th>
                        <th>DraftKings</th>
                        <th>Kalshi</th>
                        <th>Data Golf</th>
                        <th>Edge</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Table populated by JavaScript -->
                </tbody>
            </table>
        </section>

        <section class="legend">
            <h3>Edge Legend</h3>
            <ul>
                <li><span class="edge-swatch edge-none"></span> &lt;1pt</li>
                <li><span class="edge-swatch edge-light"></span> 1-3pt</li>
                <li><span class="edge-swatch edge-medium"></span> 3-6pt</li>
                <li><span class="edge-swatch edge-strong"></span> &gt;6pt</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>Data updated manually from public sportsbook odds. For informational purposes only.</p>
    </footer>

    <script type="module" src="js/main.js"></script>
</body>
</html>
